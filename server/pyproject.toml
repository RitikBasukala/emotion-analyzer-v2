[project]
name = "backend"
version = "2.0.0"
description = "Multi-modal emotion recognition API (text/audio/video + multi-tier fusion) on async FastAPI + PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.29.0",
    "deepface>=0.0.100",
    "fastapi[standard]>=0.139.0",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "safetensors>=0.4.2",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0.25",
    "torch>=2.13.0",
    "transformers>=5.13.0",
    "uvicorn>=0.51.0",
]
